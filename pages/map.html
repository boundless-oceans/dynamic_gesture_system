<!DOCTYPE html><html><head><meta charset="UTF-8"><title>庐州非遗地图</title>
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column;}
h2{text-align:center;font-family:STKaiti;font-size:36px;padding:16px 0 10px;margin:0;color:#3a5a3a;background:linear-gradient(180deg,#e8f0e0,#d8e8d0);}
#map{flex:1;min-height:400px;}
</style>
<link rel="stylesheet" href="leaflet.css"/>
</head><body>
<h2>庐州非遗地图</h2>
<div id="map"></div>
<script src="leaflet.js"></script>
<script>
var map=L.map('map').setView([31.82,117.22],11);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',attribution:'高德'}).addTo(map);
var pts=[
  [31.78,117.28,"葫芦雕刻"],[31.70,117.15,"刘铭传故事"],
  [31.85,117.27,"包公故事"],[31.86,117.28,"庐剧"],
  [31.83,117.22,"火笔画"],[31.95,117.10,"吴山铁字"]
];
pts.forEach(function(p){
  L.circleMarker([p[0],p[1]],{radius:10,fillColor:"#b42828",color:"#fff",weight:2,fillOpacity:0.9})
   .addTo(map).bindPopup("<b>"+p[2]+"</b>");
});
</script>
</body></html>
