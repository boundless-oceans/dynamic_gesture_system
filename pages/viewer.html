<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3D 交互展示</title>
<style>
    body { margin: 0; overflow: hidden; background: radial-gradient(#e0f2f7, #5ba7d1); }
    #container { width: 100vw; height: 100vh; }
    #loading {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
        color: white; font-size: 24px; font-family: "Microsoft YaHei",sans-serif;
        z-index: 1000;
    }
</style>
</head>
<body>
<div id="container"></div>
<div id="loading">加载中...</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
let scene, camera, renderer, object = null, spin = true;

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.getElementById('container').appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.1));
    const d1 = new THREE.DirectionalLight(0xffffff, 1.1); d1.position.set(1, 1, 1);  scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xffffff, 0.5); d2.position.set(-1, -0.6, -1); scene.add(d2);

    document.getElementById('loading').style.display = 'none';
    animate();
}

// 取景距离倍数（模型已在导出时归一化，通常不需要；个别想更小就调这个）
const FIT_SCALE = {};

// ── 极扁模型的初始摆位 ────────────────────────────────────────────────
// ⚠ **必须按"薄的是哪根轴"分情况**，不能只看扁平比。
//   相机的 y 和模型中心齐平，所以"薄轴"决定了你看到的是面还是边：
//
//     薄轴 = Z（匾额 / 挂屏）—— 面本来就朝着镜头，给一点侧倾露出厚度即可
//     薄轴 = Y（古琴这类**平躺**的）—— 原本是"俯视一条边"，一倾斜就成了
//                                    **从下往上仰望**（实测报过的毛病）
const FLAT_RATIO    = 5;             // 超过它才算"极扁"
const FLAT_LEAN     = -0.35;         // 薄轴 = Z：一点侧倾
const FLAT_STAND_UP = 1.30;          // 薄轴 = Y：平躺着 → 立起来才看得见正面
const FLAT_YAW      = Math.PI / 2;   // 长边正插向镜头 → 先转开，免得只看得到端头

// 初始摆位（纯函数，只吃三个边长）。
// 刻意**不碰 THREE**，这样 tests/test_viewer_pose.py 能用 node 直接跑这一份真代码，
// 而不是在 Python 里照抄一遍规则 —— 抄的那份永远测不出 JS 改坏了。
function initialPose(sx, sy, sz) {
    const maxDim = Math.max(sx, sy, sz) || 1;
    const minDim = Math.max(Math.min(sx, sy, sz), 1e-6);
    if (maxDim / minDim <= FLAT_RATIO) { return {x: 0, y: 0, branch: '-'}; }
    // 薄的是哪根轴，决定怎么摆（理由见上面那组常量）
    let r = {x: FLAT_LEAN, y: 0, branch: 'lean'};
    if (sy <= sx && sy <= sz) { r.x = FLAT_STAND_UP; r.branch = 'stand-up'; }
    if (sz >= sx && sz >= sy) { r.y = FLAT_YAW;      r.branch += '+yaw'; }
    return r;
}

// 量包围盒：骨骼模型（人偶）要按"骨骼世界坐标"算，
// 否则 SkinnedMesh 的静态几何盒会严重偏小（相机会钻进模型、旋转轴也会错）
function measureBox(root) {
    root.updateMatrixWorld(true);
    const box = new THREE.Box3();
    const v = new THREE.Vector3();
    let any = false;
    root.traverse(function (o) {
        if (o.isSkinnedMesh && o.skeleton && o.skeleton.bones && o.skeleton.bones.length) {
            o.skeleton.bones.forEach(function (b) {
                box.expandByPoint(b.getWorldPosition(v)); any = true;
            });
        } else if (o.isMesh && o.geometry) {
            if (!o.geometry.boundingBox) { o.geometry.computeBoundingBox(); }
            if (o.geometry.boundingBox) {
                box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld)); any = true;
            }
        }
    });
    if (!any || box.isEmpty()) { box.setFromObject(root); }
    return box;
}

// 把模型装进 Group：把**子节点**挪到 Group 原点上，使模型中心落在旋转轴上；
// 之后旋转 Group = 绕模型自身中心旋转
function fitCameraToGroup(group, name) {
    const box = measureBox(group);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    // ⚠ 偏移量要加在**子节点**上，不能写 `group.position.sub(center)`：
    //   那样只有在"不旋转"时才居中 —— Group 是绕自己的原点转的，
    //   而那个原点此时被挪到了 −center，于是模型会绕着**旁边**一个点甩出去。
    //   现有模型导出时中心都在原点（center≈0）所以一直没暴露；
    //   古琴的中心是 (0, 0.087, 0)，一给倾斜就明显跑偏。
    group.children.forEach(function (c) { c.position.sub(center); });

    const dims = [size.x, size.y, size.z];
    const maxDim = Math.max(dims[0], dims[1], dims[2]) || 1;
    const minDim = Math.max(Math.min(dims[0], dims[1], dims[2]), 1e-6);
    const pose = initialPose(size.x, size.y, size.z);
    group.rotation.x += pose.x;
    group.rotation.y += pose.y;

    const fov = camera.fov * Math.PI / 180;
    const scale = FIT_SCALE[name] || 1;
    const dist = (maxDim / 2) / Math.tan(fov / 2) * 1.5 * scale;
    camera.position.set(0, 0, dist);
    camera.near = Math.max(dist / 100, 0.01);
    camera.far = dist * 100;
    camera.updateProjectionMatrix();
    camera.lookAt(0, 0, 0);

    console.log('[viewer] ' + name + ' | size=' + maxDim.toFixed(2) +
                ' | scale=' + scale + ' | dist=' + dist.toFixed(2) +
                ' | flat=' + (maxDim / minDim > FLAT_RATIO) + ' | pose=' + pose.branch);
}

const loader = new THREE.GLTFLoader();

// Python 侧调用：loadModel('hulu') 等（模型位于 ../assets/models/<name>.glb）
function loadModel(name) {
    const tip = document.getElementById('loading');
    if (!name) { return; }
    tip.textContent = '加载中...';
    tip.style.display = 'block';
    if (object) {
        scene.remove(object);
        object.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
        object = null;
    }
    console.log('[viewer] loading ../assets/models/' + name + '.glb');
    loader.load('../assets/models/' + name + '.glb',
        function (gltf) {
            console.log('[viewer] loaded ' + name);
            const group = new THREE.Group();
            group.add(gltf.scene);
            // 单面材质从背面看是空的（会"看到模型内部"），统一改双面
            gltf.scene.traverse(function (o) {
                if (o.isMesh && o.material) { o.material.side = THREE.DoubleSide; }
            });
            scene.add(group);
            object = group;                 // 自转/手势旋转作用在这个 Group 上
            fitCameraToGroup(group, name);
            tip.style.display = 'none';
        },
        undefined,
        function (err) {
            console.error(err);
            tip.textContent = '模型加载失败：' + name;
        });
}

function animate() {
    requestAnimationFrame(animate);
    if (object && spin) { object.rotation.y += 0.004; }
    renderer.render(scene, camera);
}

// 手势控制接口
function zoomIn()  { camera.position.z = Math.max(camera.position.z * 0.75, 0.5); }
function zoomOut() { camera.position.z = Math.min(camera.position.z * 1.33, 200); }
function circle()  { if (object) object.rotation.y += 0.5; }
function goHome()  { window.qt.webChannelTransport.send('go_home'); }

window.onresize = function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
};

init();
</script>
</body>
</html>
