<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3D 交互展示</title>
<style>
    body { margin: 0; overflow: hidden; background: radial-gradient(#e0f2f7, #5ba7d1); }
    #container { width: 100vw; height: 100vh; }
    #loading {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
        color: white; font-size: 24px; font-family: "Microsoft YaHei",sans-serif;
        z-index: 1000;
    }
</style>
</head>
<body>
<div id="container"></div>
<div id="loading">加载中...</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
let scene, camera, renderer, object = null, spin = true;

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.getElementById('container').appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.1));
    const d1 = new THREE.DirectionalLight(0xffffff, 1.1); d1.position.set(1, 1, 1);  scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xffffff, 0.5); d2.position.set(-1, -0.6, -1); scene.add(d2);

    document.getElementById('loading').style.display = 'none';
    animate();
}

// 把模型居中并按包围盒自动设置相机距离
function fitCameraToObject(obj, offset) {
    offset = offset || 1.5;
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    obj.position.sub(center);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const fov = camera.fov * Math.PI / 180;
    const dist = (maxDim / 2) / Math.tan(fov / 2) * offset;
    camera.position.set(0, 0, dist);
    camera.near = Math.max(dist / 100, 0.01);
    camera.far = dist * 100;
    camera.updateProjectionMatrix();
    camera.lookAt(0, 0, 0);
}

const loader = new THREE.GLTFLoader();

// Python 侧调用：loadModel('hulu') 等（模型位于 ../assets/models/<name>.glb）
function loadModel(name) {
    const tip = document.getElementById('loading');
    if (!name) { return; }
    tip.textContent = '加载中...';
    tip.style.display = 'block';
    if (object) {
        scene.remove(object);
        object.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
        object = null;
    }
    loader.load('../assets/models/' + name + '.glb',
        function (gltf) {
            object = gltf.scene;
            scene.add(object);
            fitCameraToObject(object);
            tip.style.display = 'none';
        },
        undefined,
        function (err) {
            console.error(err);
            tip.textContent = '模型加载失败：' + name;
        });
}

function animate() {
    requestAnimationFrame(animate);
    if (object && spin) { object.rotation.y += 0.004; }
    renderer.render(scene, camera);
}

// 手势控制接口
function zoomIn()  { camera.position.z = Math.max(camera.position.z * 0.75, 0.5); }
function zoomOut() { camera.position.z = Math.min(camera.position.z * 1.33, 200); }
function circle()  { if (object) object.rotation.y += 0.5; }
function goHome()  { window.qt.webChannelTransport.send('go_home'); }

window.onresize = function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
};

init();
</script>
</body>
</html>
